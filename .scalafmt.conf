# Formatting for the benchmarks repository.
#
# Kept in sync with the parent DFHDL repo's .scalafmt.conf, plus one addition: token alignment.
# Benchmarks are ports of external RTL, and the generated HDL is diffed against the gold
# per-module, so the Scala is read side by side with Verilog that is itself column-aligned.
# Aligning `<>`, `=`, `=>` and `:=` keeps a port list or a constant table scannable as a table,
# which is how the baseline writes them:
#
#   val RV_DCCM_BITS: Int <> CONST       = 16
#   val RV_DCCM_FDATA_WIDTH: Int <> CONST = 39
#
# scalafmt has no config inheritance, so the settings above the align block are a copy of the
# parent's. If .scalafmt.conf changes there, mirror it here.

version = 3.11.5
runner.dialect = scala3

maxColumn = 100

assumeStandardLibraryStripMargin = true
align.stripMargin = true
rewrite.scala3.removeOptionalBraces = oldSyntaxToo
rewrite.scala3.insertEndMarkerMinLines = 15

binPack.literalArgumentLists = true
binPack.literalsMinArgCount = 5
binPack.literalsInclude = [".*"]
binPack.literalsIncludeSimpleExpr = true
binPack.literalsSingleLine = false

newlines.selectChains = keep
newlines.source = keep

align.tokens = [{code = "<>"}, {code = "="}, {code = "=>"}, {code = ":="}]
